<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netflix Content Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--panel:#141414;--card:#1c1c1c;--cell:#262626;--line:#2c2c2c;--tx:#f5f5f1;--mu:#8c8c8c;--red:#E50914;--red2:#b20710;--ok:#46d369;--g:#9b9b9b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e7e2;--panel:#fff;--card:#f6f5f2;--cell:#e8e6e1;--line:#dcdad4;--tx:#141414;--mu:#6b6b6b;--g:#777;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9e7e2;--panel:#fff;--card:#f6f5f2;--cell:#e8e6e1;--line:#dcdad4;--tx:#141414;--mu:#6b6b6b;--g:#777}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(900px 500px at 10% 0,#5a0a10 0,transparent 60%),var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:13px;min-height:100vh;padding:16px}
.app{display:grid;grid-template-columns:210px 1fr;gap:16px;max-width:1360px;margin:auto;background:#0a0a0a;border-radius:20px;padding:16px;background:var(--bg);border:1px solid var(--line)}
.side,.card{background:var(--panel);border-radius:16px}
.side{padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;align-self:start;min-height:calc(100vh - 66px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:14px;padding-left:4px}
.logo b{color:var(--red);font-size:26px;font-weight:800;letter-spacing:-1px;font-family:"Bebas Neue",Impact,sans-serif}
.nav{padding:11px 12px;border-radius:10px;color:var(--tx);cursor:pointer;display:flex;gap:10px;align-items:center;opacity:.85}
.nav:hover{background:var(--card)}.nav.on{background:var(--card);color:var(--red);opacity:1;font-weight:600}
.sp{flex:1}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--panel);border-radius:14px;padding:13px 16px;border:0;color:var(--tx);font:inherit}
.pill{background:var(--panel);border-radius:14px;padding:12px 16px;display:flex;gap:8px;align-items:center}
.live{width:8px;height:8px;border-radius:50%;background:var(--red);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
select,.seg button{font:inherit;color:var(--tx);background:var(--panel);border:0;border-radius:14px;padding:12px 14px;cursor:pointer}
.seg{display:flex;background:var(--panel);border-radius:14px;padding:4px}.seg button{padding:8px 14px;border-radius:10px;background:none}.seg button.on{background:var(--red);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:16px 18px;border-radius:16px;background:var(--panel)}
.kpi .h{display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:30px;font-weight:700;margin:14px 0 18px}.kpi .v i{color:var(--red);font-style:normal}
.kpi small,.mu{color:var(--mu);font-size:11px}
.bd{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--card)}.up{color:var(--ok)}.dn{color:var(--red)}
.row{display:grid;gap:16px}.r1{grid-template-columns:1fr 1.3fr}.r2{grid-template-columns:1fr 1.3fr}
.card{padding:18px;min-width:0}.card h3{margin:0 0 14px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.heat{display:grid;grid-template-columns:70px repeat(5,1fr);gap:6px}
.heat div{border-radius:8px;min-height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.heat .l{justify-content:flex-start;color:var(--mu);background:none;font-size:11px;min-height:0}.heat .c{background:none;color:var(--mu);min-height:0;font-size:11px}
.lg{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--mu);font-size:10px}.lg s{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:3px}
.chart{position:relative}svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;min-width:130px;opacity:0;transition:opacity .15s;box-shadow:0 8px 24px #0006}
.tip div{display:flex;justify-content:space-between;gap:14px;margin-top:5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:12px;padding:12px;cursor:pointer;border:1px solid transparent;transition:.15s}
.tile:hover{border-color:var(--red)}.tile.on{border-color:var(--red);background:#e5091422}
.tile .f{font-size:20px}.tile b{display:block;font-size:16px;margin-top:6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;font-weight:500;font-size:10px;color:var(--mu);background:var(--card);padding:10px;text-transform:uppercase}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{padding:12px 10px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}
.bar{height:4px;border-radius:2px;background:var(--cell);margin-top:5px;width:70px}.bar i{display:block;height:100%;border-radius:2px;background:var(--red)}
.tag{padding:3px 8px;border-radius:6px;background:var(--card);font-size:11px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;min-height:0;flex-direction:row;overflow-x:auto}.side .sp,.logo span{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.r1,.r2{grid-template-columns:1fr}}
@media(max-width:520px){body{padding:8px}.kpis{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}

</main></div>

 const W=600,H=250,p={l:40,r:10,t:10,b:28},vm=Math.max(1,...vy)*1.1,tm=Math.max(1,...ty)*1.1;
 const X=j=>p.l+j*(W-p.l-p.r)/(ys.length-1),Yv=x=>H-p.b-x/vm*(H-p.t-p.b),Yt=x=>H-p.b-x/tm*(H-p.t-p.b);
 const path=(arr,Y)=>{const P=arr.map((x,j)=>[X(j),Y(x)]);let d=`M${P[0][0]},${P[0][1]}`;for(let j=0;j<P.length-1;j++){const a=P[j-1]||P[j],b=P[j],c=P[j+1],e=P[j+2]||c;d+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}return d};
 let g="";for(let j=0;j<=4;j++){const y=H-p.b-j*(H-p.t-p.b)/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-6}" y="${y+3}" text-anchor="end" fill="var(--mu)" font-size="10">${Math.round(vm*j/4)}</text>`}
 ys.forEach((y,j)=>g+=`<text x="${X(j)}" y="${H-8}" text-anchor="middle" fill="var(--mu)" font-size="10">${y}</text>`);
 $("ch").innerHTML=`<svg viewBox="0 0 ${W} ${H}" id="sv">${g}<path d="${path(ty,Yt)}" fill="none" stroke="#9b9bff" stroke-width="2"/><path d="${path(vy,Yv)}" fill="none" stroke="#E50914" stroke-width="2.5"/><g id="hv" style="display:none"><line id="hl" y1="${p.t}" y2="${H-p.b}" stroke="var(--mu)" stroke-dasharray="4"/><circle id="d1" r="5" fill="#E50914" stroke="#fff"/><circle id="d2" r="5" fill="#9b9bff" stroke="#fff"/></g></svg><div class="tip" id="tp"></div>`;
 const sv=$("sv"),tp=$("tp");
 sv.onmousemove=sv.ontouchmove=e=>{const r=sv.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX),px=(cx-r.left)/r.width*W;let j=Math.round((px-p.l)/((W-p.l-p.r)/(ys.length-1)));j=Math.max(0,Math.min(ys.length-1,j));
  $("hv").style.display="";$("hl").setAttribute("x1",X(j));$("hl").setAttribute("x2",X(j));$("d1").setAttribute("cx",X(j));$("d1").setAttribute("cy",Yv(vy[j]));$("d2").setAttribute("cx",X(j));$("d2").setAttribute("cy",Yt(ty[j]));
  tp.innerHTML=`<b>${ys[j]}</b><div><span>🔴 Views</span><b>${fmt(vy[j])}M</b></div><div><span>🟣 Titles</span><b>${ty[j]}</b></div>`;tp.style.opacity=1;
  const lx=X(j)/W*r.width;tp.style.left=Math.min(lx+14,r.width-150)+"px";tp.style.top="10px"};
 sv.onmouseleave=()=>{$("hv").style.display="none";tp.style.opacity=0};
 // country tiles
 const fc=filt(true),cv=countries.map(c=>[c,sum(fc.filter(d=>d[C]==c),d=>d[V]),fc.filter(d=>d[C]==c).length]).sort((a,b)=>b[1]-a[1]);
 $("tiles").innerHTML=cv.map(x=>`<div class="tile ${st.c==x[0]?"on":""}" data-c="${x[0]}"><span class="f">${FL[x[0]]||"🌐"}</span><div style="margin-top:6px">${x[0]}</div><b>${fmt(x[1])}M <span class="mu" style="font-weight:400">views</span></b><span class="mu">${x[2]} titles</span></div>`).join("");
 document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{st.c=st.c==t.dataset.c?"All":t.dataset.c;$("cs").value=st.c;render()});
 // table
 const top=[...f].sort((a,b)=>b[V]-a[V]).slice(0,7),tm2=top[0]?top[0][V]:1;
 $("cnt").textContent=`${n} titles`;
 $("tb").innerHTML=`<tr><th>Title</th><th>Genre</th><th>Views</th><th>IMDb</th><th>Type</th><th>Country</th></tr>`+top.map(d=>`<tr><td><b>${d[T]}</b><div class="mu">${d[R]} · ${d[AD].slice(0,4)}</div></td><td>${d[G]}</td><td>${d[V]}M<div class="bar"><i style="width:${d[V]/tm2*100}%"></i></div></td><td class="${d[I]>=7?"up":""}">★ ${d[I].toFixed(1)}</td><td><span class="tag">${d[TY]}</span></td><td>${FL[d[C]]||""} ${d[C]}</td></tr>`).join("");
}
$("q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};
$("cs").onchange=e=>{st.c=e.target.value;render()};
$("clr").onclick=()=>{st.c="All";$("cs").value="All";render()};
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");st.t=b.dataset.t;render()});
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));n.classList.add("on")});
render();
</script></body></html>
